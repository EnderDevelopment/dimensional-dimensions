plugins {
    id 'net.minecraftforge.gradle' version '6.0.0'
}

group = 'com.enderdevelopment'
version = '1.0'
archivesBaseName = 'dimension_mod'

repositories {
    mavenCentral()
    maven {
        name = 'forge'
        url = 'https://files.minecraftforge.net/maven'
    }
}

ext.minecraft {
    version = '1.21.1'
    mappings = 'official'
    run {
        version = '1.21.1'
        args = ['--username', 'Player', '--accessToken', '0']
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-47.0.27'
    compileOnly fg.deobf('com.mojang:patchy:1.1.11')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.ext.minecraft_version
}

jar {
    from {
        configurations.compileClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}